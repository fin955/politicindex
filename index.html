<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>考研政治 · 背诵手册交互学习站</title>
<style>
:root{
  --paper:#EAF1F7;
  --paper-2:#F3F8FC;
  --ink:#12324A;
  --ink-2:#2B4a63;
  --mute:#5C7386;
  --line:rgba(18,50,74,.16);
  --line-2:rgba(18,50,74,.07);
  --accent:#1478B5;
  --accent-ink:#0C5C8F;
  --red:#C23A2E;
  --amber:#A86A12;
  --grid:rgba(18,50,74,.045);
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,"SFMono-Regular",monospace;
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font:13px/1.58 var(--sans);
  -webkit-font-smoothing:antialiased;
  letter-spacing:.1px;
}
/* 蓝图网格 + 流沙画布 */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.85}
/* 四角角标外框 */
.frame{position:fixed;inset:10px;z-index:6;pointer-events:none;border:1px solid var(--line)}
.frame i{position:absolute;width:13px;height:13px;border:0 solid var(--accent)}
.frame i:nth-child(1){left:-1px;top:-1px;border-left-width:2px;border-top-width:2px}
.frame i:nth-child(2){right:-1px;top:-1px;border-right-width:2px;border-top-width:2px}
.frame i:nth-child(3){left:-1px;bottom:-1px;border-left-width:2px;border-bottom-width:2px}
.frame i:nth-child(4){right:-1px;bottom:-1px;border-right-width:2px;border-bottom-width:2px}

button{font:inherit;cursor:pointer}
a{color:var(--accent-ink);text-decoration:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* 顶栏：规格区 */
.top{position:sticky;top:0;z-index:30;background:rgba(234,241,247,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 22px 9px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:1px}
.brand h1{font-size:19px;margin:0;font-weight:700;line-height:1.1;letter-spacing:.2px}
.brand .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--mute);text-transform:uppercase}
.spec{display:flex;gap:14px;margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase;flex-wrap:wrap;padding-bottom:2px}
.spec b{color:var(--accent-ink);font-weight:600}
.search{flex:1;min-width:230px;max-width:430px;position:relative}
.search input{width:100%;padding:7px 11px 7px 30px;border:1px solid var(--line);border-radius:0;background:var(--paper-2);font-size:12.5px;outline:none;color:var(--ink);font-family:var(--sans)}
.search input:focus{border-color:var(--accent);background:#fff}
.search::before{content:"⌕";position:absolute;left:10px;top:5px;color:var(--mute);font-size:14px}

/* 布局 */
.layout{display:flex;align-items:flex-start;position:relative;z-index:1}
.sidebar{width:250px;flex:0 0 250px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;border-right:1px solid var(--line);padding:12px 10px 40px;background:rgba(243,248,252,.62)}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(18,50,74,.2)}
.side-head{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--mute);text-transform:uppercase;padding:4px 8px 10px;border-bottom:1px solid var(--line-2);margin-bottom:8px;display:flex;justify-content:space-between}
.part{margin-bottom:2px}
.part-head{display:flex;align-items:center;gap:7px;padding:7px 8px;cursor:pointer;user-select:none;font-weight:600;font-size:12.5px;border-left:2px solid transparent}
.part-head:hover{background:rgba(20,120,181,.06);border-left-color:var(--accent)}
.part-dot{width:7px;height:7px;flex:0 0 7px}
.part-num{font-family:var(--mono);font-size:9.5px;color:var(--mute);margin-left:auto;letter-spacing:.05em}
.part-caret{font-size:8px;color:var(--mute);transition:transform .15s;width:8px;text-align:center}
.part.open .part-caret{transform:rotate(90deg)}
.sec-list{display:none;padding:2px 0 6px 0}
.part.open .sec-list{display:block}
.sec{padding:5px 8px 5px 16px;font-size:11.5px;color:var(--mute);border-left:2px solid transparent;cursor:pointer;line-height:1.38;display:flex;gap:6px}
.sec:hover{color:var(--ink);background:rgba(20,120,181,.05)}
.sec.active{color:var(--ink);background:rgba(20,120,181,.1);border-left-color:var(--accent);font-weight:600}
.sec .st{font-family:var(--mono);font-size:9px;color:#8aa0b2;margin-left:auto;padding-top:1px}
.sec .sn{font-family:var(--mono);font-size:9.5px;color:#8aa0b2;flex:0 0 auto;padding-top:1px}
.sec .sx{flex:1;min-width:0}

.main{flex:1;min-width:0;padding:18px 26px 90px;max-width:1180px}

/* 面包屑 / 标题：Hermes 巨型字 + line-height 1 */
.crumb{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase;margin-bottom:8px}
h2.sec-title{font-size:30px;margin:0 0 6px;font-weight:700;line-height:1.02;letter-spacing:-.2px}
h2.sec-title.sm{font-size:21px}
.sec-sub{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase;margin-bottom:16px;display:flex;gap:14px;flex-wrap:wrap}
.rule{height:1px;background:var(--line);margin:14px 0}
.card{background:rgba(255,255,255,.66);border:1px solid var(--line);border-radius:0;padding:13px 16px;margin-bottom:11px}
.card:hover{border-color:rgba(20,120,181,.42);background:rgba(255,255,255,.85)}

/* 考点列表：极细分隔线 */
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;gap:9px;padding:6px 0;border-bottom:1px solid var(--line-2);line-height:1.62}
.plist li:last-child{border-bottom:none}
.badge{flex:0 0 auto;font-family:var(--mono);font-size:9px;font-weight:700;padding:1px 5px;height:17px;line-height:15px;letter-spacing:.06em;border:1px solid}
.b5{color:var(--red);border-color:rgba(194,58,46,.45);background:rgba(194,58,46,.07)}
.b4{color:var(--amber);border-color:rgba(168,106,18,.42);background:rgba(168,106,18,.07)}
.b3{color:var(--mute);border-color:var(--line);background:rgba(18,50,74,.03)}
.ptext{flex:1}

/* 首页统计 */
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);background:rgba(255,255,255,.6);margin-bottom:16px}
.stat{padding:14px 16px;border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat .n{font-family:var(--mono);font-size:34px;font-weight:700;line-height:1;color:var(--accent-ink);letter-spacing:-1px}
.stat .l{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase;margin-top:5px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px}
.home-card{border:1px solid var(--line);background:rgba(255,255,255,.6);padding:12px 14px;cursor:pointer;position:relative}
.home-card:hover{border-color:var(--accent);background:#fff}
.home-card .hc-top{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.home-card .hc-name{font-weight:700;font-size:13px;line-height:1.3}
.home-card .hc-num{font-family:var(--mono);font-size:9px;color:var(--mute);margin-left:auto;letter-spacing:.08em}
.home-card .hc-desc{font-size:11px;color:var(--mute);line-height:1.5}
.home-card .hc-bar{height:2px;background:var(--accent);margin-top:9px;opacity:.85}

/* 史纲时间线 */
.era-tabs{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--line);margin-bottom:10px}
.era-tab{padding:6px 11px;background:transparent;border:none;border-right:1px solid var(--line);font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.era-tab:last-child{border-right:none}
.era-tab:hover{background:rgba(20,120,181,.06);color:var(--ink)}
.era-tab.active{background:var(--ink);color:#fff}
.filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.filter-bar .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.chip{padding:4px 10px;border:1px solid var(--line);background:transparent;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.chip:hover{border-color:var(--accent);color:var(--accent-ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tl{position:relative;margin-left:2px}
.tl::before{content:"";position:absolute;left:112px;top:0;bottom:0;width:1px;background:var(--line)}
.tl-item{position:relative;display:flex;gap:14px;padding:8px 0;cursor:pointer}
.tl-item:hover{background:rgba(20,120,181,.05)}
.detail-text{font-size:13.5px;line-height:1.95;color:var(--ink)}
.chip.back{margin-bottom:14px;background:var(--accent);color:#fff;border-color:var(--accent);letter-spacing:.08em}
.chip.back:hover{background:var(--accent-ink);color:#fff}
.back-chip{border-color:var(--accent);color:#fff;background:var(--accent);letter-spacing:.08em}
.back-chip:hover{background:var(--accent-ink);color:#fff}
.tl-year{flex:0 0 100px;width:100px;text-align:right;white-space:nowrap;font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--accent-ink);padding-top:1px;padding-right:0;font-variant-numeric:tabular-nums}
.tl-dot{position:absolute;left:108px;top:13px;width:9px;height:9px;background:var(--paper);border:2px solid var(--accent);z-index:1}
.tl-dot.s5{border-color:var(--red);background:var(--red)}
.tl-body{flex:1;padding-left:18px}
.tl-ev{font-weight:700;font-size:13px;margin-bottom:1px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tl-p{font-size:11.5px;color:var(--ink-2);margin-bottom:1px}
.tl-m{font-size:11.5px;color:var(--mute);line-height:1.55}
.tl-m b{color:var(--red);font-weight:600}
/* 贯通层：毛中特 / 习思想 / 思修 */
.tl-layers{margin-top:6px;display:flex;flex-direction:column;gap:3px}
.tl-layer{font-size:11px;line-height:1.5;padding-left:8px;border-left:2px solid;color:var(--ink-2)}
.tl-layer .ll{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;margin-right:6px;color:var(--mute);text-transform:uppercase}
.tl-layer.mz{border-left-color:#5b4fc4}
.tl-layer.xx{border-left-color:#a34d9e}
.tl-layer.sx{border-left-color:#14786f}
.tl-layer.go{cursor:pointer}
.tl-layer.go:hover{background:rgba(20,120,181,.06);color:var(--ink)}
.tl-layer.go::after{content:"↗";font-family:var(--mono);font-size:9px;color:var(--accent);margin-left:6px;opacity:.55}
.tl-legend{display:flex;gap:14px;flex-wrap:wrap;margin:-4px 0 12px}
.tl-legend span{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--mute);display:flex;align-items:center;gap:5px}
.tl-legend i{width:8px;height:8px;display:inline-block}
.tl-freq{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:#9D174D;border:1px solid rgba(157,23,77,.35);padding:0 4px;background:rgba(157,23,77,.06)}
.pl-div{list-style:none;margin:12px 0 4px;padding:5px 8px;background:rgba(18,50,74,.05);border-left:3px solid var(--accent);font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--accent-ink);text-transform:uppercase}
.pl-div:first-child{margin-top:0}
.plist li.pt-item{cursor:pointer}
.plist li.pt-item:hover .ptext{color:var(--accent-ink)}
.plist li.pt-item.expanded .ptext{color:var(--ink)}
.plist li.pt-item.expanded{background:rgba(20,120,181,.045)}

.empty{padding:44px;text-align:center;color:var(--mute);font-size:12px;border:1px dashed var(--line)}
.hidden{display:none!important}
mark{background:rgba(20,120,181,.16);color:inherit;padding:0 1px}
.footer-note{margin-top:24px;font-size:10.5px;color:var(--mute);line-height:1.7;border-top:1px solid var(--line);padding-top:10px;font-family:var(--mono)}
.footer-note a{color:var(--accent-ink)}

/* 刷题解疑 */
.qa-input{width:100%;min-height:120px;border:1px solid var(--line);background:var(--paper-2);padding:10px 12px;font:13px/1.6 var(--sans);color:var(--ink);resize:vertical;outline:none}
.qa-input:focus{border-color:var(--accent);background:#fff}
.qa-actions{display:flex;gap:8px;align-items:center;margin-top:9px}
.qa-actions .lab{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.qa-hintline{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 10px}
.qa-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;padding:2px 7px;border:1px solid var(--line);color:var(--mute);background:rgba(255,255,255,.62)}
.qa-tag.cap{border-color:rgba(194,58,46,.42);color:var(--red)}
.qa-tag.abs{border-color:rgba(168,106,18,.45);color:var(--amber)}
.qa-loc{padding:7px 0;border-bottom:1px dashed var(--line-2);cursor:pointer;font-size:12.5px;line-height:1.5}
.qa-loc:last-child{border-bottom:none}
.qa-loc:hover{color:var(--accent-ink)}
.qa-loc b{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--accent-ink);margin-right:6px}
.qa-src{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.05em;color:#8aa0b2;margin-top:2px}
.qa-answer{border:1px solid rgba(20,120,181,.38);background:rgba(20,120,181,.055);padding:14px 16px;margin-bottom:12px}
.qa-ans{font-size:14px;line-height:1.78;color:var(--ink);font-weight:500}
.qa-key{font-family:var(--mono);color:var(--accent-ink);font-weight:700;background:rgba(20,120,181,.13);padding:0 3px}
.qa-ans-src{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--mute);margin-top:8px;text-transform:uppercase}
.qa-opt{width:100%;border-collapse:collapse;font-size:11.5px;line-height:1.55}
.qa-opt th{text-align:left;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase;border-bottom:1px solid var(--line);padding:5px 6px}
.qa-opt td{border-bottom:1px solid var(--line-2);padding:7px 6px;vertical-align:top}
.qa-opt td:first-child{width:44%}
.qa-opt .oc b{font-family:var(--mono);color:var(--accent-ink);margin-right:4px}
.qa-warn{display:inline-block;margin-left:5px;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;color:var(--amber);border:1px solid rgba(168,106,18,.4);padding:0 4px}
.qa-miss{color:#8aa0b2}
.qa-note{font-size:10.5px;color:var(--mute);margin-top:8px;line-height:1.6}
.qa-verdict{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;padding:1px 5px;border:1px solid;white-space:nowrap}
.qa-verdict.ok{color:#0a7a3f;border-color:rgba(10,122,63,.45);background:rgba(10,122,63,.07)}
.qa-verdict.mid{color:var(--amber);border-color:rgba(168,106,18,.45);background:rgba(168,106,18,.07)}
.qa-verdict.no{color:#8aa0b2;border-color:var(--line);background:rgba(18,50,74,.03)}
.qa-suggest{margin-top:10px;font-size:13px;color:var(--ink);border-top:1px solid var(--line);padding-top:9px}
.qa-suggest b{font-family:var(--mono);font-size:15px;color:var(--accent-ink);letter-spacing:.05em}
.qa-conf{font-family:var(--mono);font-size:9.5px;color:var(--mute);margin-left:6px}
.ai-answer{font-size:13px;line-height:1.95;color:var(--ink)}
.ai-answer b{color:var(--accent-ink)}
.qa-loading{font-size:12px;color:var(--mute);font-family:var(--mono);letter-spacing:.04em}
.qa-keyrow{display:flex;gap:8px;margin-top:10px}
.qa-key{flex:1;border:1px solid var(--line);background:var(--panel);padding:8px 10px;font-family:var(--mono);font-size:12px;color:var(--ink);outline:none}
.qa-key:focus{border-color:var(--accent)}
#menuBtn{display:none}
@media (max-width:860px){
  #menuBtn{display:inline-block}
  .brand h1{font-size:16px}
  .spec{display:none}
  .sidebar{position:fixed;left:0;top:60px;z-index:40;transform:translateX(-100%);transition:.2s;background:var(--paper-2)}
  .sidebar.show{transform:none;box-shadow:8px 0 24px rgba(18,50,74,.12)}
  .main{padding:14px 14px 90px}
  h2.sec-title{font-size:23px}
  .stat-grid{grid-template-columns:1fr}
  .stat{border-right:none;border-bottom:1px solid var(--line)}
  .tl::before{left:78px}.tl-year{flex:0 0 66px;width:66px;font-size:9.5px}.tl-dot{left:74px}
}
</style>
</head>

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const state = { part:null, sec:null, era:'全部', starOnly:false, q:'' };
let flatIndex = [];

function starsBadge(n){
  const cls = n>=5?'b5':(n>=4?'b4':'b3');
  return `<span class="badge ${cls}">${'★'.repeat(n)}</span>`;
}
function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function hl(s){
  if(!state.q) return esc(s);
  const q = state.q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return esc(s).replace(new RegExp(q,'gi'), m=>`<mark>${m}</mark>`);
}

function buildIndex(){
  flatIndex = [];
  for(const p of DATA.parts){
    for(const s of (p.sections||[])){
      flatIndex.push({part:p, sec:s});
    }
  }
}

function renderSidebar(){
  const d = DATA.parts.map(p=>{
    const open = state.part===p.id ? ' open':'';
    const secs = (p.sections||[]).map(s=>
      `<div class="sec${state.part===p.id&&state.sec===s.no?' active':''}" data-p="${p.id}" data-s="${s.no}">
         <span class="st">${(s.points||[]).length}</span><span class="sn">${esc(s.no)}</span><span class="sx">${esc(s.title)}</span></div>`).join('');
    return `<div class="part${open}" data-p="${p.id}">
      <div class="part-head" data-p="${p.id}">
        <span class="part-dot" style="background:${p.color}"></span>${esc(p.short)}
        <span class="part-num">${(p.sections||[]).length} SEC</span>
        <span class="part-caret">▶</span>
      </div>
      <div class="sec-list">${secs}</div>
    </div>`;
  }).join('');
  $('#sidebar').innerHTML = d;
  $$('.part-head').forEach(el=>el.addEventListener('click',()=>{
    const id = el.dataset.p;
    if(state.part===id){ state.part=null; state.sec=null; render(); }
    else { state.part=id; state.sec=null; renderSidebar(); renderMain(); }
  }));
  $$('.sec').forEach(el=>el.addEventListener('click',()=>{
    state.part = el.dataset.p; state.sec = el.dataset.s;
    render();
    window.scrollTo({top:0,behavior:'smooth'});
    if(window.innerWidth<=820) $('#sidebar').classList.remove('show');
  }));
}

  // 单专题
  const s = (p.sections||[]).find(x=>x.no===state.sec);

  const pts = (s.points||[]).map((pt,i)=>{
    if(pt.div) return `<li class="pl-div">${esc(pt.div)}</li>`;
    const short = briefOn && pt.brief && pt.brief.length < (pt.t||'').length;
    return `<li class="pt-item" data-p="${esc(p.id)}" data-s="${esc(s.no)}" data-i="${i}">${starsBadge(pt.s)}<span class="ptext">${hl(short?pt.brief:pt.t)}</span></li>`;
  }).join('');
  const prevNext = (()=>{
    const arr = p.sections||[]; const i = arr.findIndex(x=>x.no===s.no);
    const prev = arr[i-1], next = arr[i+1];
    return `<div style="display:flex;gap:10px;margin-top:18px">

  })();
  $('#main').innerHTML = `<div class="crumb">${esc(p.short)} / ${esc(s.no)}</div>

  const bt=$('#briefToggle');

  $$('.pt-item').forEach(el=>el.addEventListener('click',()=>{
    const pp=DATA.parts.find(x=>x.id===el.dataset.p);
    const ss=(pp.sections||[]).find(x=>x.no===el.dataset.s);
    if(!ss) return;
    const pt=(ss.points||[])[+el.dataset.i];
    if(!pt) return;
    const sp=el.querySelector('.ptext');
    const showingFull = sp.dataset.full==='1';
    sp.innerHTML = hl(showingFull ? (pt.brief||pt.t) : pt.t);
    sp.dataset.full = showingFull ? '0' : '1';
    el.classList.toggle('expanded', !showingFull);
  }));
  $$('[data-goto]').forEach(el=>el.addEventListener('click',()=>{ state.sec=el.dataset.goto; render(); window.scrollTo({top:0,behavior:'smooth'}); }));
}

function render(){ renderSidebar(); renderMain(); }

function doSearch(q){
  state.q = q.trim();
  if(!state.q){ render(); return; }
  const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  const hit = t => { const s=(t||'').toLowerCase(); return terms.every(x=>s.includes(x)); };
  const hits = [];
  for(const p of DATA.parts){
    for(const s of (p.sections||[])){
      const secHit = hit(s.title) || hit(s.no);
      const pts = (s.points||[]).filter(pt=>pt.t && hit(pt.t));
      if(secHit || pts.length) hits.push({p,s,secHit,pts});
    }
    for(const r of (p.timeline||[])){
      const all = (r.y+' '+r.e+' '+r.p+' '+r.m).toLowerCase();
      if(hit(all)) hits.push({p, tl:r});
    }
  }
  if(!hits.length){
    $('#main').innerHTML = `<div class="crumb">搜索</div><h2 class="sec-title">「${esc(state.q)}」</h2><div class="empty">没有找到相关考点，换个关键词试试（如：市场、矛盾、会议、条约）。</div>`;
    return;
  }
  const html = hits.map(h=>{
    if(h.tl){
      return `<div class="card"><div class="crumb">${esc(h.p.short)} / 时间线</div>
        <div class="tl-ev">${hl(h.tl.y)} ${hl(h.tl.e)} ${starsBadge(h.tl.s)}</div>
        ${h.tl.p&&h.tl.p!=='—'?`<div class="tl-p">人物/著作：${hl(h.tl.p)}</div>`:''}
        <div class="tl-m">${hl(h.tl.m)}</div></div>`;
    }
    const pts = (h.pts.length?h.pts:(h.s.points||[]).filter(pt=>pt.t).slice(0,4)).map(pt=>`<li>${starsBadge(pt.s)}<span class="ptext">${hl(pt.t)}</span></li>`).join('');
    return `<div class="card"><div class="crumb">${esc(h.p.short)} / ${esc(h.s.no)}</div>
      <h2 class="sec-title" style="font-size:15px">${hl(h.s.title)}</h2><ul class="plist">${pts}</ul></div>`;
  }).join('');
  $('#main').innerHTML = `<div class="crumb">搜索</div><h2 class="sec-title">「${esc(state.q)}」· ${hits.length} 条结果</h2><div class="sec-sub">点击左侧可回到专题浏览；清空搜索框恢复。</div>${html}`;
}

/* —— 流沙背景：丝带流场，克制不抢内容 —— */
(function(){
  var c=document.getElementById('bg'); if(!c) return;
  var ctx=c.getContext('2d'), W=0,H=0, ribbons=[], raf=0;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize(){
    var dpr=Math.min(window.devicePixelRatio||1,2);
    W=c.width=Math.floor(innerWidth*dpr); H=c.height=Math.floor(innerHeight*dpr);
    c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px';
    var n=Math.min(46, Math.max(18, Math.round(innerWidth*innerHeight/30000)));
    ribbons=[];
    for(var i=0;i<n;i++){
      ribbons.push({y:Math.random()*H, sp:(0.10+Math.random()*0.28)*dpr, ph:Math.random()*Math.PI*2,
                    amp:(18+Math.random()*46)*dpr, w:(0.5+Math.random()*0.9)*dpr,
                    a:0.03+Math.random()*0.035});
    }
  }
  function draw(t){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<ribbons.length;i++){
      var r=ribbons[i];
      r.y+=r.sp; if(r.y>H+120) r.y=-120;
      ctx.beginPath();
      for(var x=0;x<=W;x+=16){
        var yy=r.y+Math.sin(x/(210)+r.ph+t*0.00007)*r.amp;
        if(x===0) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
      }
      ctx.lineWidth=r.w; ctx.strokeStyle='rgba(18,50,74,'+r.a.toFixed(3)+')'; ctx.stroke();
    }
  }
  var last=0;
  function loop(t){ raf=requestAnimationFrame(loop); if(t-last>40){ draw(t); last=t; } }
  addEventListener('resize', resize, {passive:true});
  resize();
  if(reduce){ draw(0); } else { raf=requestAnimationFrame(loop); }
})();

function renderTimeline(p){

  if(state.starOnly) rows = rows.filter(r=>r.s>=4);
  const tl = rows.map(r=>{
    const layers=[];

    if(r.mz) layers.push(mk('mz','毛中特',r.mz,r.mzGo));
    if(r.xx) layers.push(mk('xx','习思想',r.xx,r.xxGo));

}

/* ================= 刷题解疑：站内检索 ================= */
var CORPUS=[], IDF={}, QN=0, QBUILT=false, QA_MODE=false;
function qaTerms(s){
  s=s.replace(/[（）()【】\[\]“”"'’‘《》<>「」，。、；：？！,.;:?!/\\|—\-…\s]+/g,' ');
  var out=new Set();
  (s.match(/[\u4e00-\u9fff]+/g)||[]).forEach(function(seg){
    for(var i=0;i<seg.length-1;i++) out.add(seg.slice(i,i+2));
  });
  (s.toLowerCase().match(/[a-z0-9]+/g)||[]).forEach(function(w){ if(w.length>1) out.add(w); });
  return out;
}
function qaBuild(){
  if(QBUILT) return; QBUILT=true;
  DATA.parts.forEach(function(p){
    (p.sections||[]).forEach(function(s){
      (s.points||[]).forEach(function(pt){
        if(!pt.t) return;
        CORPUS.push({pid:p.id,pshort:p.short,no:s.no,stitle:s.title,text:pt.t,star:pt.s,type:'point'});
      });
    });
    (p.timeline||[]).forEach(function(t){
      CORPUS.push({pid:p.id,pshort:p.short,no:'时间线',stitle:t.e,
        text:(t.y+' '+t.e+' '+(t.p||'')+' '+(t.m||'')),star:t.s,type:'tl',y:t.y,m:t.m});
    });
  });
  QN=CORPUS.length;
  var df={};
  CORPUS.forEach(function(d){
    d.tf=qaTerms(d.text+' '+d.stitle);
    d.tf.forEach(function(t){ df[t]=(df[t]||0)+1; });
  });
  Object.keys(df).forEach(function(t){ IDF[t]=Math.log(1+(QN-df[t]+0.5)/(df[t]+0.5)); });
}
function qaSearch(q,k){
  qaBuild(); k=k||8;
  var qt=qaTerms(q), scored=[];
  CORPUS.forEach(function(d){
    var sc=0;
    qt.forEach(function(t){ if(d.tf.has(t)) sc+=(IDF[t]||0); });
    var tt=qaTerms(d.stitle), th=0;
    qt.forEach(function(t){ if(tt.has(t)) th++; });
    sc+=th*1.5;
    if(sc>0) scored.push({d:d,sc:sc});
  });
  scored.sort(function(a,b){return b.sc-a.sc;});
  return scored.slice(0,k);
}
function qaParseOptions(q){
  var lines=q.split(/\n+/).map(function(s){return s.trim();}).filter(Boolean);
  var opts=[], stem=[];
  lines.forEach(function(ln){
    var m=ln.match(/^[（(]?([A-Da-d])[）)]?\s*[.、．:：]\s*(.+)$/);
    if(m){ opts.push({k:m[1].toUpperCase(), t:m[2]}); }
    else { stem.push(ln); }
  });
  return {stem:stem.join(' '), opts:opts};
}
function qaAnswer(q,hits){
  if(!hits.length) return null;
  var isTime=/(什么时候|何时|哪一年|哪年|什么时间|时间|年份|时期|阶段)/.test(q);
  var isWhy=/(为什么|原因|由于|根源|依据|条件)/.test(q);
  var isMean=/(意义|作用|影响|地位|标志着|重要性|里程碑|转折点|开端)/.test(q);
  var isDef=!isMean && /(是什么|什么是|是指|含义|概念|定义|内涵)/.test(q);
  var isDiff=/(区别|不同|差异|比较|异同)/.test(q);
  var isHow=/(怎样|如何|措施|要求|怎么办|途径|方法)/.test(q);
  var stop=/(什么时候|何时|哪一年|哪年|什么是|是什么|是指|的含义|的概念|的定义|的意义|的原因|的区别|的作用|的影响|为什么|怎么样|如何|怎样|什么|哪些|哪个|请|问|一下|在|的|和|与|及|以及|是|呢|吗)/g;
  var topic=q.replace(stop,'').replace(/[，。、；：？！\sA-D.、．()（）]/g,'');
  var best=null;

  // 规则1：定义题 —— 优先取「主题词+是/指」开头的定义句
  if(isDef && topic.length>=2){
    var c1=hits.filter(function(h){
      var t=h.d.text;
      return t.indexOf(topic+'是')===0 || t.indexOf(topic+'指')===0;
    });
    if(!c1.length){
      c1=hits.filter(function(h){
        var t=h.d.text, p=t.indexOf(topic);
        if(p<0||p>10) return false;
        return /^(是|指)/.test(t.slice(p+topic.length,p+topic.length+2));
      });
    }
    if(!c1.length){
      c1=hits.filter(function(h){ return h.d.type==='point' && h.d.text.indexOf(topic)>=0 && h.d.text.indexOf(topic)<12; });
    }
    if(c1.length){ c1.sort(function(a,b){return b.sc-a.sc;}); best=c1[0].d; }
  }
  // 规则1.5：意义题 —— 优先「专题考点」原文，而不是时间线拼接文本
  if(!best && isMean && topic.length>=2){
    var c2=hits.filter(function(h){ return h.d.type==='point' && h.d.text.indexOf(topic)>=0 && h.d.text.indexOf(topic)<8; });
    if(c2.length){ c2.sort(function(a,b){return b.sc-a.sc;}); best=c2[0].d; }
  }
  // 规则2：其余题型 —— 相关度为主，题型与主题词为辅
  if(!best){
    function typeScore(d){
      var s=0,t=d.text;
      if(d.type==='point') s+=0.4;
      if(isTime&&/\d{4}/.test(t)) s+=3;
      if(isWhy&&/(原因|因为|由于|根源|依据|条件)/.test(t)) s+=3;
      if(isMean&&/(意义|作用|地位|标志着|影响|里程碑|转折点|开端)/.test(t)) s+=3;
      if(isDiff&&/(区别|不同|差异)/.test(t)) s+=3;
      if(isHow&&/(要|必须|坚持|要求|措施)/.test(t)) s+=2;
      return s;
    }
    function topicBoost(d){
      if(!topic) return 0;
      var t=d.text;
      if(t.indexOf(topic)===0) return 2;
      for(var L=Math.min(4,topic.length);L>=2;L--){
        var suf=topic.slice(topic.length-L);
        if(t.indexOf(suf)===0) return 1.2;
        var p=t.indexOf(suf);
        if(p>=0&&p<6) return 0.8;
      }
      return 0;
    }
    var top=hits[0].sc||1, bs=-1e9;
    hits.slice(0,6).forEach(function(h){
      var s=(h.sc||0)/top + typeScore(h.d)/3*0.35 + topicBoost(h.d);
      if(s>bs){bs=s;best=h.d;}
    });
  }
  var type=isTime?'时间':(isWhy?'原因':(isMean?'意义':(isDef?'定义':(isDiff?'区别':(isHow?'做法':'要点')))));
  var years=(best.text.match(/\d{4}(?:\s*[—\-–~至]\s*\d{4})?/)||[])[0]||'';
  return {d:best,type:type,years:years};
}
function qaRender(){
  var q=document.getElementById('qaInput').value.trim();
  var out=document.getElementById('qaOut');
  if(!q){ out.innerHTML='<div class="empty">先粘贴题目或输入问题</div>'; return; }
  var hits=qaSearch(q,10);
  if(!hits.length){ out.innerHTML='<div class="empty">没有匹配到考点。换几个关键词，或直接问「遵义会议的意义是什么」这类具体问题。</div>'; return; }
  var wide=qaSearch(q,30);
  var byPart={}; hits.forEach(function(h){ byPart[h.d.pshort]=(byPart[h.d.pshort]||0)+h.sc; });
  var partRank=Object.keys(byPart).sort(function(a,b){return byPart[b]-byPart[a];});
  var bySec={}, order=[];
  hits.forEach(function(h){
    if(h.d.type!=='point') return;
    var key=h.d.pid+'|'+h.d.no;
    if(!bySec[key]){ bySec[key]={d:h.d,sc:0}; order.push(key); }
    bySec[key].sc+=h.sc;
  });
  order.sort(function(a,b){return bySec[b].sc-bySec[a].sc;});
  var secs=order.slice(0,2).map(function(k){return bySec[k];});
  var tls=hits.filter(function(h){return h.d.type==='tl';}).slice(0,3);
  var cap=['根本','本质','核心','关键','首要','前提','基础','标志','实质','最'].filter(function(w){return q.indexOf(w)>=0;});
  var abs=['唯一','一切','所有','完全','彻底','必然','一定','都'].filter(function(w){return q.indexOf(w)>=0;});
  var isQ=/[A-D][.、．]/.test(q);
  var html='';
  html+='<div class="qa-hintline">'
    +'<span class="qa-tag">判定：'+(isQ?'题目解析':'知识问答')+'</span>'
    +'<span class="qa-tag">主学科：'+partRank.slice(0,2).join(' / ')+'</span>'
    +(cap.length?'<span class="qa-tag cap">帽词：'+cap.join(' ')+'</span>':'')
    +(abs.length?'<span class="qa-tag abs">绝对化：'+abs.join(' ')+'</span>':'')
    +'</div>';
  var ans=qaAnswer(q,wide);
  var parsed=qaParseOptions(q);
  if(ans && parsed.opts.length<2){
    var body=esc(ans.d.text);
    if(ans.years) body=body.replace(ans.years,'<b class="qa-key">'+ans.years+'</b>');
    html+='<div class="qa-answer"><div class="crumb">作答</div>'
      +'<div class="qa-ans">答：'+body+'</div>'
      +'<div class="qa-ans-src">依据 '+esc(ans.d.pshort)+' / '+esc(ans.d.no)+'　·　问法 '+ans.type+'</div></div>';
    var hi=-1; hits.forEach(function(h,i){ if(h.d===ans.d) hi=i; });
    if(hi>0){ var one=hits.splice(hi,1)[0]; hits.unshift(one); }
  }
  if(parsed.opts.length){
    // 题干定位到的专题（判断选项是否与题干同源）
    var stemHits = qaSearch(parsed.stem, 6);
    var stemSec = {};
    stemHits.forEach(function(h){ stemSec[h.d.pid+'|'+h.d.no] = 1; });
    function jac(a,b){ var n=0; a.forEach(function(t){ if(b.has(t)) n++; }); return n/Math.max(1,a.size); }
    var stemCore = parsed.stem;
    var sents = parsed.stem.split(/[。？！?；;]/).filter(function(x){ return x.trim().length >= 8; });
    if(sents.length) stemCore = sents[sents.length-1].trim();
    var judged = parsed.opts.map(function(o){
      var oh = qaSearch(o.t, 6);
      if(!oh.length) oh = qaSearch(parsed.stem+' '+o.t, 6);
      var ob = qaTerms(o.t), sb = qaTerms(stemCore + ' ' + parsed.stem.slice(0, 60));
      var best=null, bestScore=-1, bestOpt=0, bestStem=0, bestInStem=false;
      oh.forEach(function(h){
        var optSim = jac(ob, qaTerms(h.d.text));
        var stemSim = jac(sb, qaTerms(h.d.text));
        var inStem = !!stemSec[h.d.pid+'|'+h.d.no];
        var sc = optSim*0.62 + stemSim*0.30 + (inStem ? 0.08 : 0);
        if(sc>bestScore){ bestScore=sc; best=h.d; bestOpt=optSim; bestStem=stemSim; bestInStem=inStem; }
      });
      var verdict, cls;
      if(bestOpt>=0.45 && bestStem>=0.28){ verdict='原文支持'; cls='ok'; }
      else if(bestOpt>=0.45){ verdict='原文有此表述·与题干关联弱'; cls='mid'; }
      else if(bestOpt>=0.28 || (bestStem>=0.35 && bestOpt>=0.2)){ verdict='部分对应'; cls='mid'; }
      else { verdict='未找到依据'; cls='no'; }
      return {o:o, best:best, optSim:bestOpt, stemSim:bestStem, inStem:bestInStem, verdict:verdict, cls:cls, score:bestScore};
    });
    html+='<div class="card"><div class="crumb">选项判读（机器推断）</div><table class="qa-opt"><thead><tr><th>选项</th><th>判定</th><th>依据原文</th></tr></thead><tbody>';
    judged.forEach(function(j){
      var warn=/(而不是|不是)/.test(j.o.t)?'<span class="qa-warn">否定式</span>':'';
      html+='<tr><td class="oc"><b>'+j.o.k+'</b> '+esc(j.o.t)+warn+'</td>'
        +'<td><span class="qa-verdict '+j.cls+'">'+j.verdict+'</span></td>'
        +'<td>'+(j.best ? esc(j.best.text)+'<span class="qa-src">'+esc(j.best.pshort)+' / '+esc(j.best.no)+'</span>' : '<span class="qa-miss">未找到直接对应</span>')+'</td></tr>';
    });
    var okKeys = judged.filter(function(j){ return j.cls==='ok'; }).map(function(j){ return j.o.k; });
    var sorted = judged.slice().sort(function(a,b){ return b.score-a.score; });
    var top = sorted[0], second = sorted[1];
    var gap = (top && second) ? (top.score - second.score) : 0;
    var suggest = okKeys.length ? okKeys.join('、') + (okKeys.length>1 ? '（可能多选）' : '') : (top ? top.o.k : '—');
    var conf = (gap > 0.06) ? '区分度较高' : '区分度低，请自行判断';
    html+='</tbody></table>'
      +'<div class="qa-suggest">建议答案：<b>'+suggest+'</b> <span class="qa-conf">'+conf+'</span></div>'
      +'<div class="qa-note">机器按「选项与手册原文的吻合度 + 是否与题干同一考点」推断，仅供参考，以教材/真题答案为准。</div></div>';
  }
  if(secs.length){
    html+='<div class="card"><div class="crumb">定位到的专题（点击进入）</div>';
    secs.forEach(function(s){
      html+='<div class="qa-loc" data-go="'+s.d.pid+'|'+s.d.no+'"><b>'+esc(s.d.pshort)+' / '+esc(s.d.no)+'</b> '+esc(s.d.stitle)+'</div>';
    });
    html+='</div>';
  }
  html+='<div class="card"><div class="crumb">原文依据（背诵手册）</div><ul class="plist">';
  hits.slice(0,8).forEach(function(h){
    var loc=h.d.type==='tl'?('时间线 '+esc(h.d.y)):(esc(h.d.pshort)+' / '+esc(h.d.no));
    var body=h.d.type==='tl'?(esc(h.d.y)+' '+esc(h.d.stitle)+'：'+esc(h.d.m||'')):esc(h.d.text);
    html+='<li>'+starsBadge(h.d.star)+'<span class="ptext">'+body+'<span class="qa-src">'+loc+'</span></span></li>';
  });
  html+='</ul></div>';
  if(tls.length){
    html+='<div class="card"><div class="crumb">相关时间线节点</div><ul class="plist">';
    tls.forEach(function(h){
      html+='<li>'+starsBadge(h.d.star)+'<span class="ptext"><b>'+esc(h.d.y)+' '+esc(h.d.stitle)+'</b><br>'+esc(h.d.m||'')+'</span></li>';
    });
    html+='</ul></div>';
  }
  html+='<div class="footer-note">作答为原文抽取，非模型生成；与选项冲突以原文为准。</div>';
  html+='<div class="qa-actions" style="margin-top:10px"><button class="chip" id="qaCopy">复制题目+依据给 AI</button></div>';
  out.innerHTML=html;
  var cb=document.getElementById('qaCopy');
  if(cb) cb.onclick=function(){
    var hs=qaSearch(q,6);
    var txt='题目：'+q+'\n\n【本站检索到的依据】\n'+hs.map(function(h,i){return (i+1)+'. ['+h.d.pshort+' / '+h.d.no+'] '+h.d.text;}).join('\n');
    var done=function(){ cb.textContent='已复制'; setTimeout(function(){ cb.textContent='复制题目+依据给 AI'; },1500); };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,function(){ alert(txt); }); }
    else { window.prompt('复制下面的内容：',txt); }
  };
  Array.prototype.forEach.call(out.querySelectorAll('.qa-loc[data-go]'),function(el){
    el.addEventListener('click',function(){
      var g=el.dataset.go.split('|'); state.part=g[0]; state.sec=g[1];
      render(); window.scrollTo({top:0,behavior:'smooth'});
    });
  });
}
/* —— AI 详解：浏览器直连 DeepSeek（key 存本机，不经服务器） —— */
function qaAI(){
  var ta=document.getElementById('qaInput');
  var q=(ta&&ta.value||'').trim();
  if(!q){ return; }
  var hits=qaSearch(q,8);
  var ctx=hits.map(function(h){ return '【'+h.d.pshort+' / '+h.d.no+'】'+h.d.text; }).join('\n');
  var out=document.getElementById('qaOut');
  var card=document.getElementById('aiCard');
  if(!card){ card=document.createElement('div'); card.className='card'; card.id='aiCard'; out.insertBefore(card, out.firstChild); }
  var key='', ep='', model='';
  try {
    key=localStorage.getItem('dsk_key')||'';
    ep=localStorage.getItem('ai_ep')||'';
    model=localStorage.getItem('ai_model')||'';
  } catch(e){}
  if(!ep) ep='https://api.deepseek.com/chat/completions';
  if(!model) model='deepseek-chat';
  var isLocal = /localhost|127\.0\.0\.1|192\.168\./.test(ep);
  if(!key && !isLocal){
    card.innerHTML='<div class="crumb">AI 详解</div>'
      +'<div class="qa-note">首次使用需填 DeepSeek API Key（只存本机浏览器，不上传）。申请：platform.deepseek.com<br>想离线用本地模型（Ollama / LM Studio），把接口地址改成 <code>http://localhost:11434/v1/chat/completions</code>，模型名填 <code>qwen2.5:7b</code>，key 留空即可。</div>'
      +'<div class="qa-keyrow"><input id="dskInput" class="qa-key" type="password" placeholder="sk-...（本地模型可留空）"></div>'
      +'<div class="qa-keyrow"><input id="epInput" class="qa-key" placeholder="接口地址" value="'+esc(ep)+'"></div>'
      +'<div class="qa-keyrow"><input id="mdInput" class="qa-key" placeholder="模型名" value="'+esc(model)+'"></div>'
      +'<div class="qa-keyrow"><button class="chip on" id="dskSave">保存并解析</button></div>';
    document.getElementById('dskSave').onclick=function(){
      var v=(document.getElementById('dskInput').value||'').trim();
      var e2=(document.getElementById('epInput').value||'').trim();
      var m2=(document.getElementById('mdInput').value||'').trim();
      try {
        if(v) localStorage.setItem('dsk_key', v);
        if(e2) localStorage.setItem('ai_ep', e2);
        if(m2) localStorage.setItem('ai_model', m2);
      } catch(err){}
      qaAI();
    };
    window.scrollTo({top:0,behavior:'smooth'});
    return;
  }
  card.innerHTML='<div class="crumb">AI 详解</div><div class="qa-loading">正在调用模型，约 5—15 秒…</div>';
  window.scrollTo({top:0,behavior:'smooth'});
  var sys='你是考研政治助教，面向2027考研学生。回答规则：'
    +'①优先依据用户提供的《肖秀荣背诵手册》资料，资料能判断就在理由里引用原文；'
    +'②如果资料明显不覆盖这道题，就直接用你自己的知识作答，但必须在开头标注「【手册未覆盖·模型知识】」，提醒可能不准确；'
    +'③不要因为资料缺失就说"无法回答"，除非题目本身有误。'
    +'输出格式：第一行给出答案（单选写“答案：X”，多选写“答案：X、Y”）；'
    +'然后逐项分析 A/B/C/D，每项一行写“对/错”并给一句理由；最后一句点出本题考点。语言精炼。';
  var hdrs={'Content-Type':'application/json'};
  if(key) hdrs['Authorization']='Bearer '+key;
  fetch(ep,{
    method:'POST',
    headers:hdrs,
    body:JSON.stringify({model:model,temperature:0.2,max_tokens:1400,
      messages:[{role:'system',content:sys},{role:'user',content:'题目：\n'+q+'\n\n参考资料（手册原文）：\n'+ctx}]})
  }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok,status:r.status,j:j}; }); })
   .then(function(res){
      var el=document.getElementById('aiCard'); if(!el) return;
      if(!res.ok || !res.j.choices){
        var msg=(res.j&&res.j.error&&res.j.error.message)?res.j.error.message:('HTTP 错误');
        if(res.status===401||/401|invalid/i.test(msg)){ try{ localStorage.removeItem('dsk_key'); }catch(e){} msg+='（key 无效，已清除，请重新填写）'; }
        el.innerHTML='<div class="crumb">AI 详解（DeepSeek）</div><div class="qa-miss">调用失败：'+esc(String(msg).slice(0,160))+'</div>';
        return;
      }
      var ans=res.j.choices[0].message.content||'';
      el.innerHTML='<div class="crumb">AI 详解（DeepSeek）</div><div class="ai-answer">'+esc(ans).replace(/\n/g,'<br>')+'</div>'
        +'<div class="qa-note">模型基于本站检索到的原文作答；如与手册原文冲突，以原文为准。'
        +'<a href="#" id="dskReset" style="margin-left:8px">清除已保存的 key</a></div>';
      var rr=document.getElementById('dskReset');
      if(rr) rr.onclick=function(ev){ ev.preventDefault(); try{ localStorage.removeItem('dsk_key'); }catch(e){} el.innerHTML='<div class="crumb">AI 详解</div><div class="qa-note">已清除 key。</div>'; };
   })
   .catch(function(e){
      var el=document.getElementById('aiCard'); if(el) el.innerHTML='<div class="crumb">AI 详解</div><div class="qa-miss">网络错误：'+esc(String(e).slice(0,80))+'</div>';
   });
}
function renderQA(){
  QA_MODE=true;
  qaBuild();
  document.getElementById('main').innerHTML=
    '<div class="crumb">STUDY TOOL / RETRIEVAL</div>'
    +'<h2 class="sec-title">刷题解疑</h2>'
    +'<div class="sec-sub">粘贴题干或提问，用站内 '+QN+' 条考点定位</div>'
    +'<div class="card">'
    +'<textarea id="qaInput" class="qa-input" placeholder="例：&#10;1. 马克思主义产生的直接理论来源是（ ）&#10;A. 德国古典哲学  B. 英国古典政治经济学&#10;C. 英法空想社会主义  D. 细胞学说&#10;&#10;或直接问：遵义会议的意义是什么？"></textarea>'
    +'<div class="qa-actions"><button class="chip on" id="qaGo">解析</button><button class="chip" id="qaAI">AI 详解</button><button class="chip" id="qaClear">清空</button><span class="lab">Enter 解析 · Shift+Enter 换行</span></div>'
    +'</div><div id="qaOut"></div>';
  var qi=document.getElementById('qaInput');
  document.getElementById('qaGo').onclick=qaRender;
  var aiBtn=document.getElementById('qaAI');
  if(aiBtn) aiBtn.onclick=qaAI;
  document.getElementById('qaClear').onclick=function(){ qi.value=''; document.getElementById('qaOut').innerHTML=''; };
  qi.addEventListener('keydown',function(e){
    if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); qaRender(); }
  });
  qi.focus();
}
var _qb=document.getElementById('qaBtn'); if(_qb) _qb.onclick=renderQA;

</script>
