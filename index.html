<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>考研政治 · 背诵手册 + 真题 | 交互学习站</title>
<style>
:root{
  --paper:#EAF1F7; --paper-2:#F3F8FC; --ink:#12324A; --ink-2:#2B4a63;
  --mute:#5C7386; --line:rgba(18,50,74,.16); --line-2:rgba(18,50,74,.07);
  --accent:#1478B5; --accent-ink:#0C5C8F; --red:#C23A2E; --amber:#A86A12;
  --green:#0a7a3f; --grid:rgba(18,50,74,.045);
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,"SFMono-Regular",monospace;
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
}
.dark{
  --paper:#0B1620; --paper-2:#101E2C; --ink:#D6E6F2; --ink-2:#A3B8CC;
  --mute:#6D8AA3; --line:rgba(214,230,242,.14); --line-2:rgba(214,230,242,.06);
  --accent:#3DA0D9; --accent-ink:#6EC1EA; --red:#E06458; --amber:#D99A3E;
  --green:#4DBF7A; --grid:rgba(214,230,242,.035);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font:13px/1.58 var(--sans); -webkit-font-smoothing:antialiased; letter-spacing:.1px;
  transition:background .3s,color .3s;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),
                   linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.6}
.frame{position:fixed;inset:10px;z-index:6;pointer-events:none;border:1px solid var(--line)}
.frame i{position:absolute;width:13px;height:13px;border:0 solid var(--accent)}
.frame i:nth-child(1){left:-1px;top:-1px;border-left-width:2px;border-top-width:2px}
.frame i:nth-child(2){right:-1px;top:-1px;border-right-width:2px;border-top-width:2px}
.frame i:nth-child(3){left:-1px;bottom:-1px;border-left-width:2px;border-bottom-width:2px}
.frame i:nth-child(4){right:-1px;bottom:-1px;border-right-width:2px;border-bottom-width:2px}
button{font:inherit;cursor:pointer}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* 顶部导航 */
.top{
  position:sticky;top:0;z-index:30;
  background:rgba(234,241,247,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:0 22px;
  transition:background .3s;
}
.dark .top{background:rgba(11,22,32,.94)}
.top-row{display:flex;align-items:center;gap:14px;height:58px}
.brand{display:flex;flex-direction:column;gap:1px;flex:0 0 auto}
.brand h1{font-size:19px;margin:0;font-weight:700;line-height:1.1}
.brand .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--mute);text-transform:uppercase}

/* Tab 切换 */
.tabs{display:flex;gap:0;margin-left:4px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--paper-2)}
.tab{
  padding:6px 14px;border:none;background:transparent;font-family:var(--mono);
  font-size:10.5px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase;
  transition:.15s;font-weight:500;
}
.tab:hover{color:var(--ink);background:rgba(20,120,181,.06)}
.tab.active{background:var(--ink);color:#fff}

.search{flex:1;min-width:200px;max-width:420px;position:relative}
.search input{
  width:100%;padding:7px 11px 7px 30px;border:1px solid var(--line);border-radius:4px;
  background:var(--paper-2);font-size:12.5px;outline:none;color:var(--ink);font-family:var(--sans);transition:.2s;
}
.search input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(20,120,181,.1)}
.dark .search input:focus{background:#152433}
.search::before{content:"⌕";position:absolute;left:10px;top:5px;color:var(--mute);font-size:14px}

.top-actions{display:flex;gap:8px;align-items:center}
.chip{
  padding:6px 12px;border:1px solid var(--line);background:transparent;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase;
  border-radius:4px;transition:.15s;white-space:nowrap;
}
.chip:hover{border-color:var(--accent);color:var(--accent-ink);background:rgba(20,120,181,.05)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.back{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip.back:hover{background:var(--accent-ink);color:#fff}

/* 滚动进度条 */
#progress{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent-ink));z-index:50;width:0;transition:width .1s}

/* 布局 */
.layout{display:flex;align-items:flex-start;position:relative;z-index:1}
.sidebar{
  width:250px;flex:0 0 250px;position:sticky;top:58px;height:calc(100vh - 58px);
  overflow-y:auto;border-right:1px solid var(--line);padding:12px 10px 40px;
  background:rgba(243,248,252,.62);transition:background .3s;
}
.dark .sidebar{background:rgba(16,30,44,.62)}
.sidebar::-webkit-scrollbar{width:5px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(18,50,74,.2)}
.dark .sidebar::-webkit-scrollbar-thumb{background:rgba(214,230,242,.2)}

.side-head{
  font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--mute);
  text-transform:uppercase;padding:4px 8px 10px;border-bottom:1px solid var(--line-2);
  margin-bottom:8px;display:flex;justify-content:space-between;
}
.part{margin-bottom:2px}
.part-head{
  display:flex;align-items:center;gap:7px;padding:7px 8px;cursor:pointer;user-select:none;
  font-weight:600;font-size:12.5px;border-left:2px solid transparent;
  border-radius:0 4px 4px 0;transition:.15s;
}
.part-head:hover{background:rgba(20,120,181,.06);border-left-color:var(--accent)}
.part-dot{width:7px;height:7px;flex:0 0 7px;border-radius:50%}
.part-num{font-family:var(--mono);font-size:9.5px;color:var(--mute);margin-left:auto;letter-spacing:.05em}
.part-caret{font-size:8px;color:var(--mute);transition:transform .15s;width:8px;text-align:center}
.part.open .part-caret{transform:rotate(90deg)}
.sec-list{display:none;padding:2px 0 6px 0}
.part.open .sec-list{display:block}
.sec{
  padding:5px 8px 5px 16px;font-size:11.5px;color:var(--mute);
  border-left:2px solid transparent;cursor:pointer;line-height:1.38;
  display:flex;gap:6px;border-radius:0 3px 3px 0;transition:.1s;
}
.sec:hover{color:var(--ink);background:rgba(20,120,181,.05)}
.sec.active{color:var(--ink);background:rgba(20,120,181,.1);border-left-color:var(--accent);font-weight:600}
.sec .st{font-family:var(--mono);font-size:9px;color:#8aa0b2;margin-left:auto;padding-top:1px}
.sec .sn{font-family:var(--mono);font-size:9.5px;color:#8aa0b2;flex:0 0 auto;padding-top:1px}
.sec .sx{flex:1;min-width:0}

.main{flex:1;min-width:0;padding:22px 30px 90px;max-width:1200px}
.crumb{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase;margin-bottom:8px}
h2.sec-title{font-size:30px;margin:0 0 6px;font-weight:700;line-height:1.02;letter-spacing:-.2px}
h2.sec-title.sm{font-size:21px}
.sec-sub{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--mute);
  text-transform:uppercase;margin-bottom:16px;display:flex;gap:14px;flex-wrap:wrap;
}
.card{
  background:rgba(255,255,255,.66);border:1px solid var(--line);border-radius:6px;
  padding:14px 18px;margin-bottom:11px;transition:.2s;
}
.card:hover{border-color:rgba(20,120,181,.42);background:rgba(255,255,255,.85);transform:translateY(-1px);box-shadow:0 4px 16px rgba(18,50,74,.06)}
.dark .card{background:rgba(21,36,51,.66)}
.dark .card:hover{background:rgba(21,36,51,.85);border-color:rgba(61,160,217,.42)}

.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2);line-height:1.62}
.plist li:last-child{border-bottom:none}
.badge{
  flex:0 0 auto;font-family:var(--mono);font-size:9px;font-weight:700;padding:1px 6px;
  height:18px;line-height:16px;letter-spacing:.06em;border:1px solid;border-radius:3px;
}
.b5{color:var(--red);border-color:rgba(194,58,46,.45);background:rgba(194,58,46,.07)}
.b4{color:var(--amber);border-color:rgba(168,106,18,.42);background:rgba(168,106,18,.07)}
.b3{color:var(--mute);border-color:var(--line);background:rgba(18,50,74,.03)}
.dark .b3{background:rgba(214,230,242,.05)}
.ptext{flex:1}
mark{background:rgba(20,120,181,.2);color:inherit;padding:0 2px;border-radius:2px}

/* 首页统计 */
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);background:rgba(255,255,255,.6);margin-bottom:18px;border-radius:6px;overflow:hidden}
.dark .stat-grid{background:rgba(21,36,51,.6)}
.stat{padding:16px 18px;border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat .n{font-family:var(--mono);font-size:36px;font-weight:700;line-height:1;color:var(--accent-ink);letter-spacing:-1px}
.stat .l{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase;margin-top:6px}

/* 首页：纵向串联学习路径 */
.path{position:relative;padding-left:6px}
.path-item{position:relative;display:flex;gap:14px;padding:10px 0 10px 0;cursor:pointer}
.path-rail{position:relative;flex:0 0 34px;display:flex;flex-direction:column;align-items:center}
.path-rail::after{content:"";position:absolute;top:30px;bottom:-20px;width:1px;background:var(--line)}
.path-item:last-child .path-rail::after{display:none}
.path-node{
  width:28px;height:28px;flex:0 0 28px;border-radius:50%;border:1.5px solid var(--accent);
  background:var(--paper);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:0;transition:.2s;z-index:1;
}
.path-item:hover .path-node{background:var(--accent);color:#fff;transform:scale(1.08)}
.path-body{
  flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:11px 15px;
  background:rgba(255,255,255,.6);transition:.2s;
}
.dark .path-body{background:rgba(21,36,51,.6)}
.path-item:hover .path-body{border-color:var(--accent);background:#fff;box-shadow:0 4px 16px rgba(18,50,74,.07)}
.dark .path-item:hover .path-body{background:rgba(21,36,51,.9)}
.path-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;margin-bottom:3px}
.path-title .cnt{font-family:var(--mono);font-size:9px;font-weight:500;color:var(--mute);letter-spacing:.08em}
.path-desc{font-size:11.8px;color:var(--mute);line-height:1.6}
.path-arrow{font-size:11px;color:var(--accent);opacity:0;transition:.2s;margin-left:auto}
.path-item:hover .path-arrow{opacity:1}

/* 正文段落 */
.prose{font-size:13.8px;line-height:2.0;color:var(--ink)}
.prose p{margin:0 0 13px;text-indent:2em}
.prose p:last-child{margin-bottom:0}
.prose .prose-h{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent-ink);margin:18px 0 8px;padding-left:9px;border-left:3px solid var(--accent);
  text-indent:0;
}
.prose .prose-h:first-child{margin-top:0}
.prose .kind{
  font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.04em;
  color:var(--accent-ink);background:rgba(20,120,181,.1);
  border:1px solid rgba(20,120,181,.25);border-radius:3px;padding:0 4px;margin-right:2px;
}
.prose b.lead{font-weight:700}
.prose-sum{font-size:12.5px;line-height:1.85;color:var(--ink-2);text-indent:2em}
.prose-sum .dot{color:var(--mute)}
.card-lead{font-size:11px;color:var(--mute);font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}

/* 时间线 */
.era-tabs{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--line);margin-bottom:10px;border-radius:4px;overflow:hidden;background:var(--paper-2)}
.era-tab{
  padding:6px 12px;background:transparent;border:none;border-right:1px solid var(--line);
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase;transition:.15s;
}
.era-tab:last-child{border-right:none}
.era-tab:hover{background:rgba(20,120,181,.08);color:var(--ink)}
.era-tab.active{background:var(--ink);color:#fff}
.filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.filter-bar .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.chip.mid{border-color:rgba(168,106,18,.4);color:var(--amber)}
.tl{position:relative;margin-left:2px}
.tl::before{content:"";position:absolute;left:78px;top:0;bottom:0;width:1px;background:var(--line)}
.tl-item{position:relative;display:flex;gap:14px;padding:8px 0;cursor:pointer;border-radius:4px;transition:.15s}
.tl-item:hover{background:rgba(20,120,181,.05)}
.tl-year{flex:0 0 78px;text-align:right;font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--accent-ink);padding-top:1px;font-variant-numeric:tabular-nums}
.tl-dot{position:absolute;left:74px;top:13px;width:9px;height:9px;background:var(--paper);border:2px solid var(--accent);z-index:1;border-radius:50%;transition:transform .15s}
.tl-item:hover .tl-dot{transform:scale(1.3)}
.tl-dot.s5{border-color:var(--red);background:var(--red)}
.tl-body{flex:1;padding-left:18px}
.tl-ev{font-weight:700;font-size:13px;margin-bottom:1px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tl-p{font-size:11.5px;color:var(--ink-2);margin-bottom:1px}
.tl-m{font-size:11.5px;color:var(--mute);line-height:1.55}
.tl-m b{color:var(--red);font-weight:600}
.tl-freq{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:#9D174D;border:1px solid rgba(157,23,77,.35);padding:0 4px;background:rgba(157,23,77,.06);border-radius:3px}
.pl-div{list-style:none;margin:12px 0 4px;padding:6px 10px;background:rgba(18,50,74,.05);border-left:3px solid var(--accent);font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--accent-ink);text-transform:uppercase;border-radius:0 3px 3px 0}

/* 真题板块 */
.zt-year-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.zt-year-btn{
  border:1px solid var(--line);background:rgba(255,255,255,.6);padding:12px;
  text-align:center;cursor:pointer;border-radius:6px;transition:.2s;
}
.zt-year-btn:hover{border-color:var(--accent);background:#fff;transform:translateY(-1px)}
.dark .zt-year-btn{background:rgba(21,36,51,.6)}
.zt-year-btn .y{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--accent-ink)}
.zt-year-btn .c{font-family:var(--mono);font-size:9px;color:var(--mute);letter-spacing:.08em;margin-top:3px}
.zt-filter{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.q-card{border:1px solid var(--line);border-radius:6px;padding:14px 18px;margin-bottom:10px;background:rgba(255,255,255,.6);transition:.2s}
.dark .q-card{background:rgba(21,36,51,.6)}
.q-card:hover{border-color:var(--accent)}
.q-head{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.q-no{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--accent-ink)}
.q-type{
  font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:3px;
  border:1px solid;letter-spacing:.08em;text-transform:uppercase;
}
.q-type.单选{color:var(--green);border-color:rgba(10,122,63,.4);background:rgba(10,122,63,.07)}
.q-type.多选{color:var(--amber);border-color:rgba(168,106,18,.4);background:rgba(168,106,18,.07)}
.q-type.分析{color:var(--red);border-color:rgba(194,58,46,.4);background:rgba(194,58,46,.07)}
.q-subj{font-family:var(--mono);font-size:9.5px;color:var(--mute);letter-spacing:.05em}
.q-topic{font-size:11px;color:var(--mute);margin-left:auto}
.q-stem{font-size:13.5px;line-height:1.8;color:var(--ink);margin-bottom:12px;font-weight:500}
.q-opts{list-style:none;padding:0;margin:0 0 12px 0}
.q-opts li{
  padding:8px 12px;margin-bottom:5px;border:1px solid var(--line);border-radius:4px;
  display:flex;gap:8px;align-items:flex-start;line-height:1.6;transition:.15s;
}
.q-opts li.showing{cursor:pointer}
.q-opts li.showing:hover{border-color:var(--accent);background:rgba(20,120,181,.03)}
.q-opts li.correct{border-color:rgba(10,122,63,.4);background:rgba(10,122,63,.08)}
.q-opts li.wrong{border-color:rgba(194,58,46,.3);background:rgba(194,58,46,.04)}
.q-opts li.hide-correct{opacity:.5}
.q-let{font-family:var(--mono);font-weight:700;color:var(--accent-ink);flex:0 0 auto;font-size:13px}
.q-ans-bar{
  display:flex;gap:10px;padding:10px 14px;background:rgba(20,120,181,.06);
  border:1px solid rgba(20,120,181,.25);border-radius:4px;margin-bottom:12px;
  align-items:center;
}
.q-ans-label{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.q-ans-val{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--accent-ink);letter-spacing:.1em}
.q-analysis{
  font-size:13px;line-height:1.9;color:var(--ink);padding:12px 14px;
  background:rgba(10,122,63,.04);border-left:3px solid var(--green);border-radius:0 4px 4px 0;
}
.q-analysis b{color:var(--accent-ink)}

/* 刷题解疑 */
.qa-wrap{background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:6px;padding:20px}
.dark .qa-wrap{background:rgba(21,36,51,.6)}
.qa-input{
  width:100%;min-height:130px;border:1px solid var(--line);background:var(--paper-2);
  padding:12px 14px;font:13px/1.7 var(--sans);color:var(--ink);resize:vertical;outline:none;
  border-radius:4px;transition:.2s;
}
.qa-input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(20,120,181,.1)}
.dark .qa-input:focus{background:#152433}
.qa-actions{display:flex;gap:10px;align-items:center;margin-top:10px}
.qa-actions .lab{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.qa-endpoint{font-family:var(--mono);font-size:10px;color:var(--mute);padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--paper-2)}
.qa-endpoint input{font-family:var(--mono);font-size:11px;width:200px;border:none;background:transparent;color:var(--ink);outline:none;padding:2px}
.qa-answer{
  margin-top:16px;border:1px solid rgba(20,120,181,.35);background:rgba(20,120,181,.04);
  padding:16px 18px;border-radius:6px;
}
.qa-loading{font-size:12px;color:var(--mute);font-family:var(--mono)}
.ai-answer{font-size:13.5px;line-height:1.95;color:var(--ink);white-space:pre-wrap}
.ai-answer b{color:var(--accent-ink)}
.ai-answer .qa-verdict{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:3px;margin-right:5px}
.ai-answer .ok{color:var(--green);border:1px solid rgba(10,122,63,.4)}
.ai-answer .bad{color:var(--red);border:1px solid rgba(194,58,46,.4)}

/* 空态和加载 */
.loading{padding:60px;text-align:center;color:var(--mute);font-size:13px}
.loading .spinner{
  width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 14px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:44px;text-align:center;color:var(--mute);font-size:12px;border:1px dashed var(--line);border-radius:6px;background:rgba(255,255,255,.4)}

/* 工具条 */
.toolbar{display:flex;gap:8px;margin:4px 0 14px;flex-wrap:wrap;align-items:center}
.toolbar .grow{margin-left:auto}

/* 页脚 */
.footer-note{
  margin-top:30px;font-size:10.5px;color:var(--mute);line-height:1.7;
  border-top:1px solid var(--line);padding-top:14px;font-family:var(--mono);
}

#menuBtn{display:none}
@media (max-width:860px){
  #menuBtn{display:inline-block}
  .brand h1{font-size:16px}
  .tabs{display:none}
  .sidebar{position:fixed;left:0;top:58px;z-index:40;transform:translateX(-100%);transition:.2s;background:var(--paper-2)}
  .sidebar.show{transform:none;box-shadow:8px 0 24px rgba(18,50,74,.15)}
  .main{padding:14px 14px 90px}
  h2.sec-title{font-size:23px}
  .stat-grid{grid-template-columns:1fr}
  .stat{border-right:none;border-bottom:1px solid var(--line)}
  .tl::before{left:58px}.tl-year{flex-basis:58px}.tl-dot{left:54px}
}
</style>
</head>
<body>
<div id="progress"></div>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<header class="top">
  <div class="top-row">
    <button id="menuBtn" class="chip">☰</button>
    <div class="brand">
      <div class="tag">POLITICINDEX / 考研政治学习站</div>
      <h1>考研政治 · 背诵手册 + 真题</h1>
    </div>
    <nav class="tabs" id="mainTabs">
      <button class="tab active" data-view="manual">📖 背诵手册</button>
      <button class="tab" data-view="zhenti">📝 历年真题</button>
      <button class="tab" data-view="qa">🤖 AI 刷题解疑</button>
    </nav>
    <div class="search"><input id="search" placeholder="搜索考点 / 事件 / 会议 / 真题（如：遵义会议、魂脉、2024第1题）" autocomplete="off"></div>
    <div class="top-actions">
      <button id="darkBtn" class="chip" title="切换暗色模式">🌙</button>
    </div>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"><div class="loading"><div class="spinner"></div>数据加载中...</div></main>
</div>

<script>
/* ====== 全局状态 ====== */
const state = {
  view: 'manual',     // manual | zhenti | qa
  part: null, sec: null,
  ztYear: null, ztFilter: '全部', ztShowAnswer: false,
  era: '全部', starOnly: false, q: '',
  dark: localStorage.getItem('pi-dark')==='1'
};
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const HIST = [];

/* ====== 数据加载 ====== */
let DATA = null, ZHENTI = null;
async function loadData(){
  try{
    const [d1, d2] = await Promise.all([
      fetch('data.json').then(r=>r.json()),
      fetch('zhenti.json').then(r=>r.json()).catch(()=>null)
    ]);
    DATA = d1; ZHENTI = d2 || {};
    init();
  }catch(e){
    $('#main').innerHTML = `<div class="empty">数据加载失败：${e.message}<br>请确保 data.json 和 zhenti.json 在同一目录。</div>`;
  }
}

/* ====== 工具函数 ====== */
const esc = s => String(s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function hl(s){
  if(!state.q) return esc(s);
  const q = state.q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  try{ return esc(s).replace(new RegExp(q,'gi'), m=>`<mark>${m}</mark>`); }catch(e){ return esc(s); }
}
const starsBadge = n => {
  const cls = n>=5?'b5':(n>=4?'b4':'b3');
  return `<span class="badge ${cls}">${'★'.repeat(n)}</span>`;
};

/* ====== 侧边栏渲染 ====== */
function renderSidebar(){
  if(state.view !== 'manual'){ $('#sidebar').innerHTML = ''; return; }
  const d = DATA.parts.map(p=>{
    const open = state.part===p.id ? ' open':'';
    const secs = (p.sections||[]).map(s=>
      `<div class="sec${state.part===p.id&&state.sec===s.no?' active':''}" data-p="${p.id}" data-s="${s.no}">
         <span class="st">${(s.points||[]).length}</span>
         <span class="sn">${esc(s.no)}</span>
         <span class="sx">${esc(s.title)}</span>
       </div>`).join('');
    return `<div class="part${open}">
      <div class="part-head" data-p="${p.id}">
        <span class="part-dot" style="background:${p.color}"></span>${esc(p.short)}
        <span class="part-num">${(p.sections||[]).length} SEC</span>
        <span class="part-caret">▶</span>
      </div>
      <div class="sec-list">${secs}</div>
    </div>`;
  }).join('');
  $('#sidebar').innerHTML = `<div class="side-head">模块导航</div>${d}`;
  $$('.part-head').forEach(el=>el.addEventListener('click',()=>{
    const id = el.dataset.p;
    state.part===id ? (state.part=null, state.sec=null) : (state.part=id, state.sec=null);
    render();
  }));
  $$('.sec').forEach(el=>el.addEventListener('click',()=>{
    state.part=el.dataset.p; state.sec=el.dataset.s;
    render();
    window.scrollTo({top:0,behavior:'smooth'});
    if(window.innerWidth<=860) $('#sidebar').classList.remove('show');
  }));
}

/* ====== 首页：纵向串联的学习路径 ====== */
function renderHome(){
  const paths = DATA.parts.map((p,i)=>{
    const n = (p.sections||[]).length;
    const c = (p.sections||[]).reduce((a,s)=>a+(s.points||[]).length,0);
    const desc = p.timeline
      ? `从 1840 到新时代，用 ${n} 个阶段串起近现代史的时间骨架`
      : `${n} 个专题、${c} 条考点，从概念到辨析逐层展开`;
    return `<div class="path-item" data-p="${p.id}">
      <div class="path-rail"><div class="path-node">${String(i+1).padStart(2,'0')}</div></div>
      <div class="path-body">
        <div class="path-title">${esc(p.name)}<span class="cnt">${n} 专题</span>
          <span class="path-arrow">→</span></div>
        <div class="path-desc">${esc(desc)}</div>
      </div>
    </div>`;
  }).join('');
  const total = DATA.parts.reduce((a,p)=>a+(p.sections||[]).length,0);
  const pts = DATA.parts.reduce((a,p)=>a+(p.sections||[]).reduce((b,s)=>b+(s.points||[]).length,0),0);
  const tl = (DATA.parts.find(x=>x.timeline)||{timeline:[]}).timeline.length;
  $('#main').innerHTML = `
    <div class="crumb">背诵手册 · 总览</div>
    <h2 class="sec-title">考研政治 · 背诵手册</h2>
    <div class="sec-sub">肖秀荣《2027背诵手册》上册 · 按下面的顺序往下读，一条主线走完五个板块</div>
    <div class="stat-grid">
      <div class="stat"><div class="n">${total}</div><div class="l">专题</div></div>
      <div class="stat"><div class="n">${pts}</div><div class="l">核心考点</div></div>
      <div class="stat"><div class="n">${tl}</div><div class="l">时间线节点</div></div>
    </div>
    <div class="path">${paths}</div>
    <div class="footer-note">
      数据来源：OCR 自扫描件 + 人工校订<br>
      用法：顶部搜索框跨全部考点检索（如「量变质变」「魂脉」「遵义会议」）；切换「历年真题」tab 刷题。
    </div>`;
  $$('.path-item').forEach(el=>el.addEventListener('click',()=>{ state.part=el.dataset.p; state.sec=null; render(); }));
}

/* ====== 段落渲染 ====== */
function renderProse(sec){
  const arr = sec.prose || [];
  if(arr.length){
    return '<div class="prose">' + arr.map(x=>{
      let body = esc(x.p).replace(/【(会议|运动|事件|著作|人物)】/g,'<span class="kind">$1</span>');
      const h = x.h ? `<div class="prose-h">${esc(x.h)}</div>` : '';
      return h + `<p>${body}</p>`;
    }).join('') + '</div>';
  }
  // 回退：无 prose 时用紧凑段落拼接
  const sents = (sec.points||[]).filter(p=>!p.div).map(p=>esc(p.t||'')).join('');
  return `<div class="prose"><p>${sents || '暂无内容'}</p></div>`;
}

function proseSummary(sec, limit){
  const arr = sec.prose || [];
  let text = arr.length ? arr.map(x=>x.p).join('') : (sec.points||[]).map(p=>p.t||'').join('');
  text = text.replace(/[【】]/g,'');
  if(text.length > limit) text = text.slice(0, limit) + '…';
  return `<p class="summary">${esc(text)}</p>`;
}

/* ====== 时间线 ====== */
function renderTimeline(p){
  const eras = ['全部','旧民主主义','新民主主义','社会主义革命和建设','改革开放','新时代'];
  const eraTabs = eras.map(e=>`<button class="era-tab${state.era===e?' active':''}" data-e="${e}">${e}</button>`).join('');
  let rows = (p.timeline||[]);
  if(state.era!=='全部') rows = rows.filter(r=>r.era===state.era);
  if(state.starOnly) rows = rows.filter(r=>r.s>=4);
  const tl = rows.map(r=>`<div class="tl-item">
    <div class="tl-year">${esc(r.y)}</div><div class="tl-dot${r.s>=5?' s5':''}"></div>
    <div class="tl-body">
      <div class="tl-ev">${hl(r.e)} ${starsBadge(r.s)}${r.freq?`<span class="tl-freq">真题×${r.freq}</span>`:''}</div>
      ${r.p&&r.p!=='—'?`<div class="tl-p">人物/著作：${hl(r.p)}</div>`:''}
      <div class="tl-m">${hl(r.m)}</div>
    </div></div>`).join('');
  return `<div class="era-tabs">${eraTabs}</div>
    <div class="filter-bar">
      <span class="lab">筛选</span>
      <button class="chip${state.starOnly?' on':''}" id="starFilter">只看 ★★★★ 及以上</button>
      <span class="lab" style="margin-left:auto">${rows.length} 个节点</span>
    </div>
    <div class="tl">${tl}</div>`;
}

function bindTimeline(){
  $$('.era-tab').forEach(el=>el.addEventListener('click',()=>{ state.era=el.dataset.e; renderMain(); }));
  const sf = $('#starFilter'); if(sf) sf.addEventListener('click',()=>{ state.starOnly=!state.starOnly; renderMain(); });
}

/* ====== 手册主渲染 ====== */
function renderManual(){
  if(!state.part){ renderHome(); return; }
  const p = DATA.parts.find(x=>x.id===state.part);
  if(!p){ renderHome(); return; }
  // 板块总览：每个专题一段导读文字，而非四条罗列
  if(!state.sec){
    const tlBlock = p.timeline ? `<div class="card reading"><div class="crumb">交互时间线</div>
      <h2 class="sec-title sm">史纲 · 重要事件时间线</h2>
      <div class="sec-sub">按时期/重要度筛选</div>${renderTimeline(p)}</div>` : '';
    const secs = (p.sections||[]).map(s=>{
      return `<div class="card reading" data-goto="${esc(s.no)}" style="cursor:pointer">
        <div class="crumb">${esc(s.no)}${s.key?` · ${s.key} 个重点`:''}</div>
        <h2 class="sec-title sm">${hl(s.title)}</h2>
        ${proseSummary(s, 150)}
        <div class="path-arrow" style="opacity:1;text-align:right;margin-top:6px">继续阅读 →</div>
      </div>`;
    }).join('');
    $('#main').innerHTML = `<div class="crumb">${esc(p.short)}</div>
      <h2 class="sec-title">${esc(p.name)}</h2>
      <div class="sec-sub">${(p.sections||[]).length} 个专题 · 依次阅读</div>
      ${tlBlock}${secs}`;
    bindTimeline();
    $$('[data-goto]').forEach(el=>el.addEventListener('click',()=>{ state.sec=el.dataset.goto; render(); window.scrollTo({top:0,behavior:'smooth'}); }));
    return;
  }
  // 单专题：连贯段落
  const s = (p.sections||[]).find(x=>x.no===state.sec);
  if(!s){ renderHome(); return; }
  const arr = p.sections||[]; const i = arr.findIndex(x=>x.no===s.no);
  const prev = arr[i-1], next = arr[i+1];
  const chars = (s.prose||[]).reduce((a,x)=>a+(x.p||'').length,0);
  $('#main').innerHTML = `<div class="crumb">${esc(p.short)} / ${esc(s.no)}</div>
    <h2 class="sec-title">${hl(s.title)}</h2>
    <div class="reading-meta">
      <span>全文 <b>${chars}</b> 字</span>
      <span>段落 <b>${(s.prose||[]).length}</b></span>
      <span>重点 <b>${s.key||0}</b> 处</span>
    </div>
    <div class="card reading">${renderProse(s)}</div>
    <div style="display:flex;gap:10px;margin-top:18px">
      ${prev?`<button class="chip" data-goto="${esc(prev.no)}">← ${esc(prev.no)}</button>`:''}
      ${next?`<button class="chip" data-goto="${esc(next.no)}" style="margin-left:auto">${esc(next.no)} ${esc(next.title).slice(0,12)} →</button>`:''}
    </div>`;
  $$('[data-goto]').forEach(el=>el.addEventListener('click',()=>{ state.sec=el.dataset.goto; render(); window.scrollTo({top:0,behavior:'smooth'}); }));
}

/* ====== 真题渲染 ====== */
const SUBJECTS = ['全部','马原','毛中特','习思想','史纲','思修','形势与政策'];
function renderZhenti(){
  const years = Object.keys(ZHENTI).sort().reverse();
  if(!state.ztYear){
    // 年份选择
    const yearBtns = years.map(y=>`<div class="zt-year-btn" data-y="${y}">
      <div class="y">${y}</div><div class="c">${ZHENTI[y].length} 题</div></div>`).join('');
    $('#main').innerHTML = `
      <div class="crumb">历年真题 · 选择年份</div>
      <h2 class="sec-title">考研政治真题 · 2017—2026</h2>
      <div class="sec-sub">${years.length} 年 · ${years.reduce((a,y)=>a+ZHENTI[y].length,0)} 道题 · 点击年份开始刷题</div>
      <div class="zt-year-grid">${yearBtns}</div>
      <div class="footer-note">
        💡 建议：先刷近 3 年，再按科目分类查漏补缺；「AI 刷题解疑」可对接深度详解。
      </div>`;
    $$('.zt-year-btn').forEach(el=>el.addEventListener('click',()=>{ state.ztYear=el.dataset.y; state.ztShowAnswer=false; render(); }));
    return;
  }
  // 真题详情
  let qs = ZHENTI[state.ztYear] || [];
  // 筛选
  if(state.ztFilter!=='全部'){
    qs = qs.filter(q => (q.subject||'').includes(state.ztFilter));
  }
  const subjBtns = SUBJECTS.map(s=>`<button class="chip${state.ztFilter===s?' on':''}" data-s="${s}">${s}</button>`).join('');
  const toggleAns = `<button class="chip${state.ztShowAnswer?' on':''}" id="toggleAns">${state.ztShowAnswer?'隐藏答案':'显示答案'}</button>`;
  const back = `<button class="chip back" id="ztBack">← 返回年份选择</button>`;

  const qCards = qs.map(q=>{
    const optsHtml = Object.entries(q.options||{}).map(([k,v])=>{
      const letter = k; const text = v.text || ''; const correct = v.correct;
      let cls = '';
      if(state.ztShowAnswer){
        cls = correct ? 'correct' : 'hide-correct';
      }
      return `<li class="${cls}"><span class="q-let">${letter}.</span><span>${esc(text)}</span></li>`;
    }).join('');
    const ansHtml = state.ztShowAnswer ? `<div class="q-ans-bar">
      <span class="q-ans-label">答案</span><span class="q-ans-val">${esc(q.answer||'—')}</span>
      <span class="q-ans-label" style="margin-left:20px">考点</span><span class="q-subj">${esc(q.subject)} · ${esc(q.topic)}</span>
    </div>` : '';
    const anaHtml = state.ztShowAnswer && q.analysis ? `<div class="q-analysis">${esc(q.analysis)}</div>` : '';
    return `<div class="q-card">
      <div class="q-head">
        <span class="q-no">Q${q.no}</span>
        <span class="q-type ${q.type}">${q.type}</span>
        <span class="q-subj">${esc(q.subject||'')}</span>
        <span class="q-topic">${esc(q.topic||'')}</span>
      </div>
      <div class="q-stem">${esc(q.stem)}</div>
      ${ansHtml}
      <ul class="q-opts">${optsHtml}</ul>
      ${anaHtml}
    </div>`;
  }).join('') || `<div class="empty">该科目暂无题目</div>`;

  $('#main').innerHTML = `
    <div class="crumb">真题 · ${state.ztYear}</div>
    <h2 class="sec-title">${state.ztYear} 年考研政治真题</h2>
    <div class="sec-sub">共 ${(ZHENTI[state.ztYear]||[]).length} 道题 · 当前显示 ${qs.length} 道</div>
    <div class="toolbar">
      ${back}
      ${toggleAns}
      <div class="grow"></div>
      <span class="lab" style="font-family:var(--mono);font-size:9.5px;color:var(--mute);letter-spacing:.14em;text-transform:uppercase">按科目</span>
    </div>
    <div class="toolbar">${subjBtns}</div>
    ${qCards}`;
  $('#ztBack').onclick = ()=>{ state.ztYear=null; render(); window.scrollTo(0,0); };
  $('#toggleAns').onclick = ()=>{ state.ztShowAnswer=!state.ztShowAnswer; render(); window.scrollTo(0,0); };
  $$('[data-s]').forEach(el=>el.addEventListener('click',()=>{ state.ztFilter=el.dataset.s; render(); }));
}

/* ====== QA 刷题解疑 ====== */
function renderQA(){
  $('#main').innerHTML = `
    <div class="crumb">AI 刷题解疑</div>
    <h2 class="sec-title">粘贴题目 · 获取详解</h2>
    <div class="sec-sub">对接 DeepSeek · 基于背诵手册知识库 · 自动定位考点</div>
    <div class="qa-wrap">
      <div class="qa-input" contenteditable="true" id="qaInput" spellcheck="false" data-placeholder="在这里粘贴选择题或分析题题干...&#10;支持：单选/多选/材料分析题&#10;示例：&#10;2024年第1题：习近平新时代中国特色社会主义思想...的魂脉和根脉是...&#10;A.马克思主义和中华优秀传统文化&#10;B...."></div>
      <div class="qa-actions">
        <div class="qa-endpoint">
          ENDPOINT: <input id="qaEndpoint" placeholder="/.netlify/functions/ask">
        </div>
        <div class="grow" style="flex:1"></div>
        <button class="chip" id="qaClear">清空</button>
        <button class="chip on" id="qaSend">🚀 发送</button>
      </div>
      <div id="qaResult"></div>
      <div class="footer-note">
        ⚠️ 需要在 Netlify 部署后填写正确 endpoint，或本地搭建代理。参考 ask.js 后端代码。
      </div>
    </div>`;
  const input = $('#qaInput');
  // 占位符效果
  const placeholder = input.dataset.placeholder;
  input.addEventListener('focus', ()=>{ if(input.textContent===placeholder) input.textContent=''; });
  input.addEventListener('blur', ()=>{ if(!input.textContent.trim()) input.textContent=placeholder; });
  input.textContent = placeholder;

  $('#qaClear').onclick = ()=>{ input.textContent = placeholder; $('#qaResult').innerHTML=''; };
  $('#qaSend').onclick = ()=> doQA();

  // 快捷键
  input.addEventListener('keydown', e=>{
    if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); doQA(); }
  });
}

async function doQA(){
  const input = $('#qaInput');
  let q = input.textContent.trim();
  if(!q || q===input.dataset.placeholder){ $('#qaResult').innerHTML = `<div class="empty">请先粘贴题目</div>`; return; }
  const result = $('#qaResult');
  result.innerHTML = `<div class="qa-answer"><div class="qa-loading">⏳ 正在分析题目...</div></div>`;

  // 搜索相关考点作为 context
  const context = searchForQA(q);

  const endpoint = $('#qaEndpoint').value || '/.netlify/functions/ask';
  try{
    const resp = await fetch(endpoint, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ question: q, context })
    });
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const data = await resp.json();
    result.innerHTML = `<div class="qa-answer">
      <div class="crumb" style="margin-bottom:8px">🤖 AI 详解</div>
      <div class="ai-answer">${formatAnswer(data.answer||'（无返回）')}</div>
      <div class="footer-note">📚 已匹配 ${context.length} 条相关考点作为上下文</div>
    </div>`;
  }catch(e){
    // 离线回退：基于本地数据的简单匹配
    const offline = buildOfflineAnswer(q);
    result.innerHTML = `<div class="qa-answer" style="border-color:var(--amber);background:rgba(168,106,18,.05)">
      <div class="crumb" style="margin-bottom:8px;color:var(--amber)">⚠️ 离线模式（后端未连接）</div>
      <div class="ai-answer">${formatAnswer(offline)}</div>
      <div class="footer-note">💡 要启用 AI 详解，请在 Netlify 部署 ask.js 函数并填入 endpoint。</div>
    </div>`;
  }
}

function searchForQA(q){
  if(!DATA) return [];
  const terms = q.toLowerCase().split(/[\s，。、；：""''（）()]/).filter(x=>x.length>=2);
  const hits = [];
  for(const p of DATA.parts){
    for(const s of (p.sections||[])){
      for(const pt of (s.points||[])){
        const t = (pt.t||'').toLowerCase();
        if(terms.some(tm=>t.includes(tm))){
          hits.push(`[${p.short}·${s.no}] ${pt.t}`);
          if(hits.length>=12) return hits.join('\n');
        }
      }
    }
  }
  return hits.join('\n');
}

function buildOfflineAnswer(q){
  const hits = searchForQA(q);
  return `【离线模式 · 本地匹配结果】

你粘贴的题目可能涉及以下考点（来自背诵手册）：

${hits || '未在手册中匹配到关键词。建议检查题目是否完整，或等待 AI 后端部署。'}

---

💡 要获取完整 AI 详解（逐项分析、正确答案、考点定位），请：
1. 部署 ask.js 到 Netlify Functions
2. 在上方 endpoint 填入部署后的地址
3. 重新发送`;
}

function formatAnswer(text){
  return esc(text)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/(答案[：:]\s*\S+)/g, '<b>$1</b>')
    .replace(/(本题考点[：:].+)/g, '<b>$1</b>')
    .replace(/(正确答案?[：:].+)/g, '<b>$1</b>')
    .replace(/\n/g, '<br>');
}

/* ====== 搜索 ====== */
function doSearch(q){
  state.q = q.trim();
  if(!state.q){
    if(state.view==='zhenti'){ state.ztFilter='全部'; render(); }
    else render();
    return;
  }
  const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  const hit = t => { const s=(t||'').toLowerCase(); return terms.every(x=>s.includes(x)); };
  const results = [];

  // 手册搜索
  if(DATA){
    for(const p of DATA.parts){
      for(const s of (p.sections||[])){
        const pts = (s.points||[]).filter(pt=>pt.t && hit(pt.t));
        const titles = hit(s.title) || hit(s.no);
        if(titles || pts.length) results.push({type:'manual', p, s, pts, tl:null});
      }
      for(const r of (p.timeline||[])){
        const all = (r.y+' '+r.e+' '+r.p+' '+r.m).toLowerCase();
        if(hit(all)) results.push({type:'timeline', p, tl:r});
      }
    }
  }
  // 真题搜索
  if(ZHENTI){
    for(const y of Object.keys(ZHENTI)){
      for(const qq of ZHENTI[y]){
        const all = (qq.no+' '+qq.stem+' '+qq.topic+' '+qq.subject+' '+qq.answer).toLowerCase();
        const optsTxt = Object.values(qq.options||{}).map(o=>o.text).join(' ').toLowerCase();
        if(hit(all) || hit(optsTxt)){
          results.push({type:'zhenti', year:y, q:qq});
          if(results.length >= 300) break;
        }
      }
      if(results.length >= 300) break;
    }
  }

  if(!results.length){
    $('#main').innerHTML = `<div class="crumb">搜索</div><h2 class="sec-title">「${esc(state.q)}」</h2><div class="empty">没有找到相关内容。试试：「市场」「矛盾」「会议」「遵义」。</div>`;
    return;
  }

  const html = results.slice(0,150).map(r=>{
    if(r.type==='zhenti'){
      return `<div class="q-card" style="cursor:pointer" data-zt="${r.year}">
        <div class="q-head"><span class="q-no">${r.year}·Q${r.q.no}</span>
        <span class="q-type ${r.q.type}">${r.q.type}</span>
        <span class="q-subj">${esc(r.q.subject)}</span></div>
        <div class="q-stem">${hl(r.q.stem)}</div>
      </div>`;
    }
    if(r.type==='timeline'){
      return `<div class="card"><div class="crumb">${esc(r.p.short)} / 时间线</div>
        <div class="tl-ev">${hl(r.tl.y)} ${hl(r.tl.e)} ${starsBadge(r.tl.s)}</div>
        <div class="tl-m">${hl(r.tl.m)}</div></div>`;
    }
    const body = r.s.prose && r.s.prose.length
      ? r.s.prose.map(x=>x.p).join('')
      : (r.s.points||[]).map(p=>p.t||'').join('');
    const brief = body.length > 220 ? body.slice(0,220) + '…' : body;
    return `<div class="card reading" style="cursor:pointer" data-manual="${r.p.id}" data-sec="${r.s.no}">
      <div class="crumb">${esc(r.p.short)} / ${esc(r.s.no)}</div>
      <h2 class="sec-title sm">${hl(r.s.title)}</h2>
      <p class="summary">${hl(brief.replace(/[【】]/g,''))}</p></div>`;
  }).join('');

  $('#main').innerHTML = `<div class="crumb">搜索</div><h2 class="sec-title">「${esc(state.q)}」 · ${results.length} 条结果</h2>
    <div class="sec-sub">手册 + 真题 联合检索</div>${html}
    <div class="footer-note">💡 点击真题结果会跳转到对应年份；清空搜索框返回当前视图。</div>`;

  $$('[data-zt]').forEach(el=>el.addEventListener('click',()=>{ state.view='zhenti'; state.ztYear=el.dataset.zt; state.q=''; $('#search').value=''; render(); }));
  $$('[data-manual]').forEach(el=>el.addEventListener('click',()=>{ state.view='manual'; state.part=el.dataset.manual; state.sec=el.dataset.sec; state.q=''; $('#search').value=''; render(); }));
}

/* ====== 主渲染 ====== */
function render(){
  renderSidebar();
  switch(state.view){
    case 'zhenti': renderZhenti(); break;
    case 'qa': renderQA(); break;
    default: renderManual();
  }
  // 进度条
  requestAnimationFrame(()=>{
    const h = document.documentElement;
    const p = h.scrollTop/(h.scrollHeight-h.clientHeight)*100;
    $('#progress').style.width = Math.min(100,Math.max(0,p))+'%';
  });
}

/* ====== 初始化 ====== */
function init(){
  // 暗色模式
  if(state.dark){ document.body.classList.add('dark'); $('#darkBtn').textContent='☀️'; }
  $('#darkBtn').onclick = ()=>{
    state.dark = !state.dark;
    localStorage.setItem('pi-dark', state.dark?'1':'0');
    document.body.classList.toggle('dark');
    $('#darkBtn').textContent = state.dark?'☀️':'🌙';
  };

  // Tab
  $$('#mainTabs .tab').forEach(t=>t.addEventListener('click',()=>{
    $$('#mainTabs .tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    state.view = t.dataset.view;
    state.q = ''; $('#search').value='';
    render(); window.scrollTo({top:0});
  }));

  // 搜索
  let timer=null;
  $('#search').addEventListener('input', e=>{
    clearTimeout(timer);
    timer = setTimeout(()=>{
      const q = e.target.value.trim();
      if(q) doSearch(q);
      else render();
    }, 200);
  });
  $('#search').addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); doSearch(e.target.value); }
  });
  $('#menuBtn').onclick = ()=> $('#sidebar').classList.toggle('show');

  render();
  animate();
}

/* ====== 流沙背景（简化版） ====== */
function animate(){
  var c=$('#bg'); if(!c) return;
  var ctx=c.getContext('2d'), W=0,H=0, ribbons=[], raf=0, last=0;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize(){
    var dpr=Math.min(window.devicePixelRatio||1,2);
    W=c.width=Math.floor(innerWidth*dpr); H=c.height=Math.floor(innerHeight*dpr);
    c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px';
    ribbons=[]; var n=Math.min(40, Math.max(15, Math.round(innerWidth*innerHeight/35000)));
    for(var i=0;i<n;i++){
      ribbons.push({y:Math.random()*H, sp:(0.08+Math.random()*0.25)*dpr, ph:Math.random()*Math.PI*2,
                    amp:(14+Math.random()*42)*dpr, w:(0.4+Math.random()*0.8)*dpr, a:0.025+Math.random()*0.03});
    }
  }
  function draw(t){
    ctx.clearRect(0,0,W,H);
    var ink = state.dark ? 'rgba(214,230,242,' : 'rgba(18,50,74,';
    for(var i=0;i<ribbons.length;i++){
      var r=ribbons[i]; r.y+=r.sp; if(r.y>H+120) r.y=-120;
      ctx.beginPath();
      for(var x=0;x<=W;x+=20){
        var yy=r.y+Math.sin(x/(220)+r.ph+t*0.00006)*r.amp;
        x===0?ctx.moveTo(x,yy):ctx.lineTo(x,yy);
      }
      ctx.lineWidth=r.w; ctx.strokeStyle=ink+r.a.toFixed(3)+')'; ctx.stroke();
    }
  }
  function loop(t){ raf=requestAnimationFrame(loop); if(t-last>50){ draw(t); last=t; } }
  addEventListener('resize', resize, {passive:true});
  resize();
  if(!reduce) raf=requestAnimationFrame(loop); else draw(0);
}

/* ====== 启动 ====== */
loadData();
